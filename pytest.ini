[pytest]
testpaths = tests
addopts =
    -ra
    --import-mode=importlib
    --cov=common
    --cov=Qwen_MoE_experts_fusion_experiment
    --cov=experts_fusion
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
