name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      # Install the CPU-only PyTorch build first so the heavy CUDA wheel is not
      # pulled in by the unpinned `torch` entry in tests/requirements.txt.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      # The suite runs on CPU with mocked models (tests/conftest.py forces CPU
      # and tests/experiment/conftest.py fakes transformers/datasets), so no GPU
      # or network model download is required.
      - name: Run tests
        run: pytest tests/
