[pytest]
testpaths = tests
addopts =
    -ra
    --import-mode=importlib
    --ignore=tests/experiment
    --ignore=reap
    --cov=common
    --cov=experts_fusion
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
